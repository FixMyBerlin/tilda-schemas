name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format-check

      - name: Lint
        run: bun run lint-check

      - name: Build package
        run: bun run build

      - name: Typecheck
        run: bun run type-check

      - name: Test
        run: bun run test-run

      - name: Install Playwright browser
        working-directory: apps/preview
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (preview)
        run: bun run --cwd apps/preview test-e2e

      - name: Check exports (publint, attw)
        run: bun run check-exports

      - name: Build preview
        run: bun run build-preview
